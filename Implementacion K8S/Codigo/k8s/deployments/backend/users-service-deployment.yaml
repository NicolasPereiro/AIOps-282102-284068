apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmago-users-service
  namespace: pharmago
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pharmago-users-service
  template:
    metadata:
      labels:
        app: pharmago-users-service
    spec:
      # Afinidad blanda (declarativa): este entorno corre en un único nodo
      # físico (minikube), por lo que la separación por label `workload` se
      # expresa como preferencia y no como requisito de scheduling.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: workload
                operator: In
                values: [users]
      containers:
      - name: pharmago-users-service
        image: pharmago-users-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        env:
        - name: ConnectionStrings__DefaultConnection
          value: "Server=pharmago-db;Database=PharmaDb;User Id=sa;Password=Str0ngP@ssword!"
        - name: ServiceUrls__PharmacyService
          value: "http://pharmago-pharmacy-service:80"
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: Logging__LogLevel__Microsoft.EntityFrameworkCore
          value: "None"
        - name: Logging__LogLevel__Microsoft.Data.SqlClient
          value: "None"
        # Recursos reducidos para nodos ~5GB (proyecto docente)
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
